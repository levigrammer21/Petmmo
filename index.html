<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#102725" />
  <title>Wilderden</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div id="auth" class="auth-shell">
    <section class="auth-card">
      <div class="brand-mark">W</div><p class="eyebrow">IDLE RPG</p><h1>Wilderden</h1>
      <p class="auth-copy">Train your Keeper. Put pets to work. Come back stronger.</p>
      <button id="google" class="btn primary wide">Continue with Google</button>
      <div class="or"><span></span><b>or</b><span></span></div>
      <input id="email" class="input" type="email" placeholder="Email" autocomplete="email" />
      <input id="password" class="input" type="password" placeholder="Password" autocomplete="current-password" />
      <div class="auth-row"><button id="signin" class="btn wide">Sign in</button><button id="create" class="btn wide">Create account</button></div>
      <button id="local" class="link-btn">Play locally on this device</button>
      <p id="auth-message" class="small muted"></p>
    </section>
  </div>
  <div id="game" class="game hidden">
    <header class="topbar">
      <button class="mobile-menu" id="menu-btn" aria-label="Menu">☰</button>
      <div class="brand"><div class="brand-mark small">W</div><div><strong>Wilderden</strong><small id="version"></small></div></div>
      <div class="top-stats"><span>🪙 <b id="coins">0</b></span><span>❤️ <b id="keeper-hp">0/0</b></span><span>🐾 <b id="pet-count">0</b></span></div>
      <button id="account-btn" class="icon-btn" title="Account">⋯</button>
    </header>
    <div class="layout">
      <aside id="sidebar" class="sidebar"></aside>
      <main id="main" class="main"></main>
    </div>
    <nav id="bottom-nav" class="bottom-nav"></nav>
  </div>
  <div id="toast-zone" class="toast-zone"></div>
  <dialog id="modal"><div id="modal-body"></div><button class="modal-close" onclick="this.closest('dialog').close()">×</button></dialog>
  <script type="module" src="app.js"></script>
</body>
</html>
